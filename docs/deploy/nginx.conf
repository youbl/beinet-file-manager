# Install inside nginx's http context (e.g. /etc/nginx/conf.d/beinet.conf).
# Replace domain and certificate paths. All paths go through AuthorizationFilter.
server {
    listen 80;
    server_name files.example.com;
    return 301 https://files.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name files.example.com;
    ssl_certificate /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1100m;
    client_body_timeout 300s;
    # OAuth callback query contains a code: do not store it in the access log.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host files.example.com;
        proxy_set_header X-Forwarded-Host files.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
